<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SASCHED — Student Appointment &amp; Queue Portal</title>
    <meta name="description" content="SASCHED is the official online appointment scheduling and live queue management system for university Cashier and Registrar services." />
    <meta name="theme-color" content="#0284c7" />

    <!-- Favicon & Device Touch Icons for Google Search and Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sasched.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sasched.com/" />
    <meta property="og:title" content="SASCHED — Student Appointment &amp; Queue Portal" />
    <meta property="og:description" content="SASCHED is the official online appointment scheduling and live queue management system for university Cashier and Registrar services." />
    <meta property="og:image" content="https://sasched.com/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SASCHED — Student Appointment &amp; Queue Portal" />
    <meta name="twitter:description" content="SASCHED is the official online appointment scheduling and live queue management system for university Cashier and Registrar services." />
    <meta name="twitter:image" content="https://sasched.com/logo.png" />

    <!-- Structured Data (JSON-LD) for Google Search Engine -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SASCHED",
      "url": "https://sasched.com",
      "applicationCategory": "EducationalApplication",
      "description": "SASCHED is the official online appointment scheduling and live queue management system for university Cashier and Registrar services.",
      "operatingSystem": "All"
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("sasched_client_prefs_v1");
          var pref = raw ? JSON.parse(raw).theme : "light";
          var hasSession = false;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1) {
              hasSession = true;
              break;
            }
          }
          var resolved =
            !hasSession
              ? "light"
              : pref === "dark"
                ? "dark"
                : pref === "system" &&
                    window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
